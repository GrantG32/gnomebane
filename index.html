<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gnomebane</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Almendra:wght@400;700&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#120d1f; --panel:#1c1432; --panel2:#251b42; --ink:#f3ecd9; --muted:#b0a3cc;
  --gold:#f0c14b; --line:#3d2f63; --hot:#ff8a2b;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Alegreya Sans",system-ui,sans-serif;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:min(100vw,calc((100vh - 8px) * 1.6));aspect-ratio:16/10;background:#000;font-size:16px;box-shadow:0 0 0 1px var(--line),0 20px 60px rgba(0,0,0,.6)}
canvas{display:block;width:100%;height:100%;cursor:crosshair;touch-action:none}
.ov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(12,7,26,.82);overflow:auto;padding:1em}
.ov.on{display:flex}
.panel{width:min(100%,52em);text-align:center;margin:auto}
.panel.wide{width:min(100%,66em)}
h1,h2,h3{font-family:Almendra,Georgia,serif;font-weight:700;margin:0}
h1{font-size:4.6em;letter-spacing:.02em;line-height:1;color:var(--gold);text-shadow:0 .06em 0 #6b3d00,0 0 .6em rgba(240,193,75,.35)}
h2{font-size:2.3em;line-height:1.1}
h3{font-size:1.4em;margin:.3em 0 .2em}
.sub{color:var(--muted);font-size:1.15em;margin:.5em 0 1.2em}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:.9em}
.card{font:inherit;color:inherit;text-align:center;background:linear-gradient(180deg,var(--panel2),var(--panel));border:2px solid var(--line);border-radius:.6em;padding:1em .9em 1.1em;cursor:pointer;display:flex;flex-direction:column;align-items:center;transition:transform .12s,border-color .12s}
.card:hover,.card:focus-visible{transform:translateY(-.25em);border-color:var(--gold);outline:none}
.card svg{width:3.4em;height:3.4em}
.card p{margin:.2em 0;color:var(--muted);font-size:1.02em;line-height:1.3}
.card .meta{margin-top:.6em;font-weight:700;color:var(--gold);font-size:1em}
.card .note{margin-top:.5em;font-weight:700;color:#9be564;font-size:.98em}
.key{font-size:.85em;color:var(--muted);border:1px solid var(--line);border-radius:.3em;padding:.05em .45em}
.btn{font:inherit;font-family:Almendra,Georgia,serif;font-weight:700;font-size:1.6em;color:#2a1600;background:linear-gradient(180deg,#ffd970,#e0a92c);border:0;border-radius:.5em;padding:.4em 1.6em;cursor:pointer;box-shadow:0 .18em 0 #7a4a00;min-width:7em}
.btn.alt{color:var(--ink);background:linear-gradient(180deg,#3a2c66,#2a1f4d);box-shadow:0 .18em 0 #120a26}
.btn:hover,.btn:focus-visible{filter:brightness(1.12);outline:none}
.btn:active{transform:translateY(.1em);box-shadow:0 .08em 0 #7a4a00}
.menu{display:flex;flex-direction:column;align-items:center;gap:.8em;margin:1.2em 0 .6em}
.menu .btn{width:11em}
.gal{display:inline-flex;align-items:center;gap:.35em;font-family:Almendra,Georgia,serif;font-weight:700;font-size:1.5em;color:var(--gold)}
.coin{width:1.1em;height:1.1em;flex:none}
.bar{display:flex;align-items:center;justify-content:space-between;gap:1em;margin-bottom:1em}
.back{font:inherit;font-weight:700;font-size:1.1em;color:var(--ink);background:var(--panel2);border:2px solid var(--line);border-radius:.5em;padding:.3em 1em;cursor:pointer}
.back:hover,.back:focus-visible{border-color:var(--gold);outline:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(13em,1fr));gap:.8em;text-align:center}
.item{background:linear-gradient(180deg,var(--panel2),var(--panel));border:2px solid var(--line);border-radius:.6em;padding:.8em .7em .9em;display:flex;flex-direction:column;align-items:center}
.item.eq{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.item .pv svg{width:5em;height:6.5em}
.item h3{font-size:1.15em;margin:.2em 0 .1em}
.item .st{margin:.1em 0 .4em;color:var(--gold);font-weight:700;font-size:.95em}
.item ul{list-style:none;margin:0 0 .6em;padding:0;text-align:left;font-size:.92em;color:var(--muted);width:100%}
.item li{display:flex;align-items:center;gap:.4em;padding:.1em 0}
.item li svg{width:1.4em;height:1.4em;flex:none}
.item .buy{margin-top:auto;font:inherit;font-weight:700;font-size:1em;color:#2a1600;background:linear-gradient(180deg,#ffd970,#e0a92c);border:0;border-radius:.4em;padding:.35em .9em;cursor:pointer;display:inline-flex;align-items:center;gap:.3em}
.item .buy:disabled{filter:grayscale(.8) brightness(.6);cursor:not-allowed}
.item .buy.on{background:linear-gradient(180deg,#8fe38a,#4fb04a)}
@media (max-width:640px){.cards{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="stage">
  <canvas id="c" width="960" height="600"></canvas>
  <div id="ov" class="ov"></div>
</div>

<script>
(()=>{
"use strict";
const W=960,H=600,TAU=Math.PI*2,MAXLV=100;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const ov=document.getElementById('ov'),stage=document.getElementById('stage');

/* ---------- helpers ---------- */
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const lerp=(a,b,t)=>a+(b-a)*t;
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function rr(x,y,w,h,r,fill,stroke){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
  if(fill){ctx.fillStyle=fill;ctx.fill()} if(stroke){ctx.strokeStyle=stroke;ctx.stroke()}
}
function circ(x,y,r,fill){ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fillStyle=fill;ctx.fill()}
function line(x1,y1,x2,y2,c,w){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.strokeStyle=c;ctx.lineWidth=w;ctx.lineCap='round';ctx.stroke()}
function scaleStage(){stage.style.fontSize=Math.max(9,stage.getBoundingClientRect().width/960*16)+'px'}
addEventListener('resize',scaleStage);scaleStage();
const fmt=n=>Math.round(n).toLocaleString('en-US');

/* ---------- save data ---------- */
let SAVE={gal:0,staffs:[0],staff:0,helpers:[],helper:-1,best:0};
try{const j=JSON.parse(localStorage.getItem('gnomebane_save_v2')||'null');if(j)SAVE=Object.assign(SAVE,j)}catch(e){}
const save=()=>{try{localStorage.setItem('gnomebane_save_v2',JSON.stringify(SAVE))}catch(e){}};
const COIN='<svg class="coin" viewBox="0 0 20 20"><circle cx="10" cy="10" r="8.6" fill="#f0c14b" stroke="#8a5a00" stroke-width="1.6"/><circle cx="10" cy="10" r="5.4" fill="none" stroke="#b07a10" stroke-width="1.4"/><path d="M8 10h4M10 7.5v5" stroke="#8a5a00" stroke-width="1.4" stroke-linecap="round"/></svg>';

/* ---------- ability archetypes (icons) ---------- */
const GLYPH={
  comet:c=>`<path d="M15 23 L3 37 L22 30Z" fill="#ff5a2b" opacity=".85"/><circle cx="24" cy="16" r="10" fill="${c}"/><circle cx="24" cy="16" r="5" fill="#ffe08a"/>`,
  nova:c=>`<g fill="none" stroke="${c}" stroke-width="3" stroke-linecap="round"><path d="M20 4V36M6 12L34 28M6 28L34 12"/><path d="M15 6l5 4 5-4M15 34l5-4 5 4" stroke-width="2"/></g>`,
  chain:c=>`<path d="M24 2 L8 22 H19 L14 38 L33 16 H22Z" fill="${c}" stroke="#fff6b0" stroke-width="1.5" stroke-linejoin="round"/>`,
  lance:c=>`<path d="M5 35 L29 11" stroke="${c}" stroke-width="4.5" stroke-linecap="round"/><path d="M24 4 L37 3 L36 16Z" fill="${c}" stroke="#fff" stroke-width="1"/>`,
  rain:c=>`<g fill="${c}"><circle cx="10" cy="24" r="4.5"/><circle cx="22" cy="30" r="5.5"/><circle cx="32" cy="18" r="4"/></g><g stroke="${c}" stroke-width="2.5" stroke-linecap="round" opacity=".6"><path d="M6 8L10 19M18 10L22 24M29 4L32 13"/></g>`,
  orbit:c=>`<circle cx="20" cy="20" r="12" fill="none" stroke="${c}" stroke-width="1.5" opacity=".5"/><g fill="${c}"><circle cx="20" cy="8" r="4.5"/><circle cx="30.4" cy="26" r="4.5"/><circle cx="9.6" cy="26" r="4.5"/></g>`,
  aegis:c=>`<path d="M20 3 L35 9 V20 C35 29 28 35 20 38 C12 35 5 29 5 20 V9Z" fill="${c}" opacity=".85" stroke="#fff" stroke-width="1.5"/><path d="M20 10 V30" stroke="#fff" stroke-width="2" opacity=".6"/>`,
  vortex:c=>`<path d="M20 20 m0 0 a3 3 0 0 1 6 0 a7 7 0 0 1 -14 0 a11 11 0 0 1 22 0 a15 15 0 0 1 -30 0" fill="none" stroke="${c}" stroke-width="3" stroke-linecap="round"/>`,
  fan:c=>`<g stroke="${c}" stroke-width="3.5" stroke-linecap="round"><path d="M6 34 L34 8M6 34 L36 22M6 34 L28 4M6 34 L37 33"/></g><circle cx="6" cy="34" r="3.5" fill="#fff"/>`,
  blink:c=>`<g fill="${c}"><circle cx="9" cy="28" r="5" opacity=".45"/><circle cx="31" cy="12" r="6"/></g><path d="M13 25 L26 15" stroke="${c}" stroke-width="2.5" stroke-dasharray="3 3" stroke-linecap="round"/>`,
  cloud:c=>`<g fill="${c}"><circle cx="13" cy="24" r="8"/><circle cx="23" cy="18" r="9"/><circle cx="29" cy="26" r="7"/><rect x="9" y="26" width="24" height="6" rx="3"/></g><g fill="#0d2a10" opacity=".55"><circle cx="17" cy="24" r="1.8"/><circle cx="25" cy="23" r="1.8"/><path d="M17 29 h8" stroke="#0d2a10" stroke-width="1.5"/></g>`,
  turret:c=>`<path d="M12 36 L15 18 H25 L28 36Z" fill="#8a8f99" stroke="#555a60" stroke-width="1.5"/><circle cx="20" cy="14" r="8" fill="${c}"/><path d="M20 14 L36 8" stroke="${c}" stroke-width="3.5" stroke-linecap="round"/>`,
  spikes:c=>`<g fill="${c}" stroke="#fff" stroke-width="1" stroke-linejoin="round"><path d="M4 36 L10 12 L16 36Z"/><path d="M14 36 L21 4 L28 36Z"/><path d="M26 36 L32 16 L37 36Z"/></g>`,
  drain:c=>`<path d="M20 3 C28 14 33 20 33 26 A13 13 0 0 1 7 26 C7 20 12 14 20 3Z" fill="${c}" stroke="#fff" stroke-width="1.5"/><path d="M14 27 C14 31 17 33 20 33" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" opacity=".7"/>`,
  haste:c=>`<circle cx="20" cy="20" r="15" fill="none" stroke="${c}" stroke-width="3.5"/><path d="M20 10V20L27 24" fill="none" stroke="${c}" stroke-width="3.5" stroke-linecap="round"/>`
};
const ACOL={comet:'#ff8a2b',nova:'#8fe3ff',chain:'#ffe066',lance:'#9fe8ff',rain:'#ff9a4a',orbit:'#c9a3ff',aegis:'#7fc8ff',vortex:'#b57bff',fan:'#ffd27a',blink:'#d17bff',cloud:'#8ee05a',turret:'#ffd166',spikes:'#c8a37a',drain:'#ff6f91',haste:'#7dffb0'};
const arcSVG=id=>`<svg viewBox="0 0 40 40">${GLYPH[id](ACOL[id])}</svg>`;
const ICONIMG={};
for(const k in GLYPH){const i=new Image();i.src='data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">'+GLYPH[k](ACOL[k])+'</svg>');ICONIMG[k]=i}
const UICON={
  speed:'<svg viewBox="0 0 40 40" fill="none" stroke="#9be564" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 8l12 12L8 32M22 8l12 12-12 12"/></svg>',
  might:'<svg viewBox="0 0 40 40"><path d="M20 2 L25 15 L38 20 L25 25 L20 38 L15 25 L2 20 L15 15Z" fill="#b48cff" stroke="#e5d4ff" stroke-width="1.5" stroke-linejoin="round"/></svg>',
  heart:'<svg viewBox="0 0 40 40"><path d="M20 35 C4 24 3 12 11 8 C16 6 19 9 20 12 C21 9 24 6 29 8 C37 12 36 24 20 35Z" fill="#ff5a6e" stroke="#ffc2ca" stroke-width="1.5"/></svg>'
};

/* ---------- ability archetypes (logic) ---------- */
const ARCH={
 comet:{
  st:l=>{const dmg=34+16*l,r=Math.min(55+7*l,200),cd=Math.max(2.2,4.6-.3*l);return{l,dmg,r,cd,burn:l>=3,triple:l>=6,desc:`${dmg} damage, ${r} radius, ${cd.toFixed(1)}s cooldown`}},
  perk:l=>l===3?'Leaves burning ground':l===6?'Launches three comets':'',
  cast:s=>{const tip=staffTip(),n=s.triple?3:1,dT=clamp(Math.hypot(mouse.x-tip.x,mouse.y-tip.y),110,700);
    for(let k=0;k<n;k++){const an=P.aim+(n===1?0:(k-1)*.22);fireballs.push({x:tip.x,y:tip.y,vx:Math.cos(an)*430,vy:Math.sin(an)*430,left:dT,s:{dmg:s.dmg,r:s.r,burn:s.burn,burnDps:10+4*s.l}})}}},
 nova:{
  st:l=>{const dmg=20+9*l,r=Math.min(100+14*l,360),cd=Math.max(3,6.5-.4*l),slowT=2+.3*l;return{l,dmg,r,cd,slowT,freeze:l>=4,twice:l>=7,desc:`${dmg} damage, ${r} radius, ${cd.toFixed(1)}s cooldown`}},
  perk:l=>l===4?'Freezes gnomes solid':l===7?'Pulses twice':'',
  cast:s=>{frostPulse(s);if(s.twice)later.push({t:.35,fn:()=>frostPulse(s)})}},
 chain:{
  st:l=>{const dmg=28+11*l,jumps=Math.min(3+l,14),cd=Math.max(2.5,5.5-.35*l);return{l,dmg,jumps,cd,stun:l>=5,twice:l>=8,desc:`${dmg} damage, ${jumps} chain jumps, ${cd.toFixed(1)}s cooldown`}},
  perk:l=>l===5?'Stuns struck gnomes':l===8?'Strikes twice':'',
  cast:s=>{if(!enemies.some(e=>!e.dead&&dist(e,P)<440))return false;strike(s);if(s.twice)later.push({t:.3,fn:()=>strike(s)})}},
 lance:{
  st:l=>{const dmg=40+18*l,cd=Math.max(1.8,4-.25*l),n=l>=8?3:l>=5?2:1;return{l,dmg,cd,n,desc:`${dmg} damage, pierces every gnome, ${cd.toFixed(1)}s cooldown`}},
  perk:l=>l===5?'Fires two lances':l===8?'Fires three lances':'',
  cast:s=>{const t=staffTip();for(let k=0;k<s.n;k++){const an=P.aim+(k-(s.n-1)/2)*.16;bolts.push({x:t.x,y:t.y,vx:Math.cos(an)*950,vy:Math.sin(an)*950,dmg:s.dmg*DM(),life:.8,pierce:true,hit:new Set(),r:10,c:ACOL.lance,big:true})}}},
 rain:{
  st:l=>{const dmg=30+13*l,n=Math.min(3+Math.floor(l/2),12),cd=Math.max(3.5,7-.35*l);return{l,dmg,n,cd,burn:l>=6,desc:`${n} meteors of ${dmg} damage, ${cd.toFixed(1)}s cooldown`}},
  perk:l=>l===6?'Meteors leave burning ground':'',
  cast:s=>{for(let i=0;i<s.n;i++){const an=rand(0,TAU),d=Math.sqrt(Math.random())*110,x=clamp(mouse.x+Math.cos(an)*d,30,W-30),y=clamp(mouse.y+Math.sin(an)*d,30,H-30);
    ring(x,y,52,'#ff9a4a',.6+.16*i,3);later.push({t:.6+.16*i,fn:()=>explode(x,y,{dmg:s.dmg,r:52,burn:s.burn,burnDps:8+3*s.l})})}}},
 orbit:{
  st:l=>{const n=Math.min(2+Math.floor(l/2),8),dur=5+.3*l,dmg=14+7*l,cd=Math.max(7,11-.3*l);return{l,n,dur,dmg,cd,desc:`${n} orbs, ${dmg} damage per hit, lasts ${dur.toFixed(1)}s`}},
  perk:l=>l%2===0?'One more orb':'',
  cast:s=>{P.orbit={t:s.dur,n:s.n,dmg:s.dmg,ang:0}}},
 aegis:{
  st:l=>{const sh=30+14*l,cd=Math.max(9,15-.5*l);return{l,sh,cd,heal:l>=5?.1:0,desc:`Absorbs ${sh} damage for 7s, ${cd.toFixed(1)}s cooldown`}},
  perk:l=>l===5?'Also heals 10% health':'',
  cast:s=>{P.shield=s.sh;P.shieldT=7;if(s.heal){P.hp=Math.min(P.maxHp,P.hp+P.maxHp*s.heal);addText(P.x,P.y-40,'+'+Math.round(P.maxHp*s.heal),'#7dff9a')}ring(P.x,P.y,46,'#7fc8ff',.4,4)}},
 vortex:{
  st:l=>{const r=Math.min(110+8*l,240),dur=2.5+.2*l,dps=25+10*l,cd=Math.max(6,10-.4*l);return{l,r,dur,dps,cd,pull:l>=5?1.6:1,desc:`Pulls gnomes in, ${dps} damage per second for ${dur.toFixed(1)}s`}},
  perk:l=>l===5?'Pulls much harder':'',
  cast:s=>{zones.push({x:mouse.x,y:mouse.y,r:s.r,t:0,T:s.dur,tick:0,dps:s.dps*DM(),kind:'vortex',pull:s.pull})}},
 fan:{
  st:l=>{const n=Math.min(5+Math.floor(l/2),13),dmg=20+8*l,cd=Math.max(1.8,3.6-.2*l);return{l,n,dmg,cd,desc:`${n} bolts of ${dmg} damage, ${cd.toFixed(1)}s cooldown`}},
  perk:l=>l%2===0?'One more bolt':'',
  cast:s=>{const t=staffTip();for(let k=0;k<s.n;k++){const an=P.aim+(k/(s.n-1)-.5)*.75;bolts.push({x:t.x,y:t.y,vx:Math.cos(an)*640,vy:Math.sin(an)*640,dmg:s.dmg*DM(),life:.5,c:ACOL.fan,r:5})}}},
 blink:{
  st:l=>{const dmg=30+12*l,cd=Math.max(3,6-.3*l);return{l,dmg,cd,dest:l>=4,inv:l>=6,desc:`Teleport to your cursor, ${dmg} damage burst, ${cd.toFixed(1)}s cooldown`}},
  perk:l=>l===4?'Also bursts where you land':l===6?'1s of invulnerability after blinking':'',
  cast:s=>{const dx=mouse.x-P.x,dy=mouse.y-P.y,d=Math.hypot(dx,dy)||1,m=Math.min(d,300);
    blast(P.x,P.y,90,s.dmg,'#d17bff');
    P.x=clamp(P.x+dx/d*m,28,W-28);P.y=clamp(P.y+dy/d*m,34,H-26);
    if(s.dest)blast(P.x,P.y,90,s.dmg,'#d17bff');else ring(P.x,P.y,40,'#d17bff',.3,3);
    if(s.inv)P.inv=Math.max(P.inv,1)}},
 cloud:{
  st:l=>{const r=Math.min(90+6*l,180),dur=4+.3*l,dps=22+9*l,cd=Math.max(4,7-.3*l);return{l,r,dur,dps,cd,desc:`${dps} damage per second, slows gnomes, lasts ${dur.toFixed(1)}s`}},
  perk:l=>'',
  cast:s=>{zones.push({x:mouse.x,y:mouse.y,r:s.r,t:0,T:s.dur,tick:0,dps:s.dps*DM(),kind:'poison'})}},
 turret:{
  st:l=>{const n=l>=5?2:1,dur=8+.4*l,dmg=12+5*l,cd=Math.max(9,12-.3*l);return{l,n,dur,dmg,cd,desc:`${n} turret${n>1?'s':''}, ${dmg} damage per shot, lasts ${dur.toFixed(1)}s`}},
  perk:l=>l===5?'Summons two turrets':'',
  cast:s=>{for(let i=0;i<s.n;i++)turrets.push({x:P.x+rand(-40,40),y:P.y+rand(-40,40),t:0,T:s.dur,cd:.3,dmg:s.dmg});ring(P.x,P.y,50,'#ffd166',.35,3)}},
 spikes:{
  st:l=>{const dmg=26+11*l,cd=Math.max(2.6,5-.25*l);return{l,dmg,cd,lines:l>=5?3:1,desc:`${dmg} damage along a line, ${cd.toFixed(1)}s cooldown`}},
  perk:l=>l===5?'Erupts in three lines':'',
  cast:s=>{const offs=s.lines===3?[-.38,0,.38]:[0];for(const o of offs)for(let i=0;i<7;i++){const an=P.aim+o,x=P.x+Math.cos(an)*(55+i*50),y=P.y+Math.sin(an)*(55+i*50);
    if(x<10||x>W-10||y<10||y>H-10)continue;ring(x,y,44,'#c8a37a',.15+.07*i,2);later.push({t:.15+.07*i,fn:()=>blast(x,y,44,s.dmg,'#c8a37a')})}}},
 drain:{
  st:l=>{const r=Math.min(130+8*l,260),dmg=20+8*l,cd=Math.max(4,7-.3*l);return{l,r,dmg,cd,stun:l>=5,desc:`${dmg} damage, heals you for 30% of it, ${cd.toFixed(1)}s cooldown`}},
  perk:l=>l===5?'Stuns drained gnomes':'',
  cast:s=>{ring(P.x,P.y,s.r,'#ff6f91',.45,6);let total=0;

  if(!w.some(x=>x>0))w=[1,1,1];
  return{L,bi,pos,boss:false,mod:m,n:Math.round(clamp((6+pos*1.3+bi*2.2)*(m.n||1),4,54)),hp:h*(m.hp||1),dmg:d*(m.dmg||1),spd:m.spd||1,sz:m.sz||1,w};
}

function damageEnemy(e,amt,o){

  addText(e.x+rand(-8,8),e.y-e.r-14,Math.round(amt),o.color||'#fff');

}
function hitPlayer(d){

function blast(x,y,r,dmg,c){

/* ---------- abilities ---------- */
function cast(i){
  if(state!=='wave')return;const a=ab[i];if(a.cd>0)return;
  const A=ARCH[curStaff.abil[i].a],s=A.st(a.lv);
  if(A.cast(s)===false)return;

}
function explode(x,y,s){
  ring(x,y,s.r,'#ff8a2b',.35,6);burst(x,y,'#ffb347',22,240,4.5);shake=Math.max(shake,4);
  for(const e of enemies){if(!e.dead&&Math.hypot(e.x-x,e.y-y)<s.r+e.r){damageEnemy(e,s.dmg*DM(),{color:'#ffb347'});if(s.burn){e.burnT=3;e.burnDps=s.burnDps*DM()}}}
  if(s.burn)zones.push({x,y,r:s.r*.8,t:0,T:3,tick:0,dps:s.burnDps*DM(),kind:'fire'});
}
function frostPulse(s){
  ring(P.x,P.y,s.r,'#8fe3ff',.5,7);burst(P.x,P.y,'#d9f6ff',26,260,4);
  for(const e of enemies){if(e.dead||dist(e,P)>s.r+e.r)continue;
    damageEnemy(e,s.dmg*DM(),{color:'#bff0ff'});e.slowT=s.slowT;e.slowF=.45;
    if(s.freeze)e.stunT=Math.max(e.stunT,e.boss?.35:1)}
  eprojs=eprojs.filter(p=>Math.hypot(p.x-P.x,p.y-P.y)>s.r);
}
function strike(s){
  const cands=enemies.filter(e=>!e.dead&&dist(e,P)<440);if(!cands.length)return;
  let t=cands[0],bd=1e9;for(const e of cands){const d=Math.hypot(e.x-mouse.x,e.y-mouse.y);if(d<bd){bd=d;t=e}}
  const hit=new Set([t]);let cur=t,dmg=s.dmg;const pts=[staffTip(),{x:t.x,y:t.y}];
  zap(t,dmg,s);
  for(let j=0;j<s.jumps;j++){
    let b2=null,bd2=175;
    for(const e of enemies){if(e.dead||hit.has(e))continue;const d=dist(e,cur);if(d<bd2){bd2=d;b2=e}}
    if(!b2)break;hit.add(b2);dmg*=.93;zap(b2,dmg,s);pts.push({x:b2.x,y:b2.y});cur=b2;
  }
  const jag=[];
  for(let i=0;i<pts.length-1;i++){const a=pts[i],b=pts[i+1];const n=7;
    for(let k=0;k<n;k++){const f=k/n,o=k===0?0:rand(-9,9);const nx=-(b.y-a.y),ny=b.x-a.x,nl=Math.hypot(nx,ny)||1;jag.push({x:lerp(a.x,b.x,f)+nx/nl*o,y:lerp(a.y,b.y,f)+ny/nl*o})}}
  jag.push(pts[pts.length-1]);
  bolts2.push({pts:jag,t:0,T:.3});
}
function zap(e,d,s){damageEnemy(e,d*DM(),{color:'#ffe066'});burst(e.x,e.y,'#fff3a0',8,180,3);if(s.stun)e.stunT=Math.max(e.stunT,e.boss?.15:.6)}

/* ---------- enemy AI ---------- */
function fireProj(e,ang,def){
  const pr=def.proj;eprojs.push({x:e.x+Math.cos(ang)*14,y:e.y+Math.sin(ang)*14,vx:Math.cos(ang)*pr.s,vy:Math.sin(ang)*pr.s,r:pr.r,c:pr.c,dmg:e.dmg,slow:pr.slow,life:4});
}
function updateEnemy(e,dt){
  if(e.hitFlash>0)e.hitFlash-=dt;
  if(e.orbCd>0)e.orbCd-=dt;
  if(e.burnT>0){e.burnT-=dt;e.burnTick-=dt;if(e.burnTick<=0){e.burnTick=.4;damageEnemy(e,e.burnDps*.4,{quiet:true,color:'#ff9a3c'})}}
  if(e.dead)return;
  if(e.stunT>0){e.stunT-=dt;return}
  let sp=e.spd;if(e.slowT>0){e.slowT-=dt;sp*=e.slowF}
  const dx=P.x-e.x,dy=P.y-e.y,d=Math.hypot(dx,dy)||1,ux=dx/d,uy=dy/d;
  e.cd-=dt;e.walk+=dt*sp*.09;
  if(e.st!=='dash'&&e.st!=='chargeDash')e.face=Math.atan2(dy,dx);
  const def=e.def;
  if(e.swing>0){e.swing-=dt;if(e.swing<=0&&e.pendingHit){e.pendingHit=false;if(dist(e,P)<(def.reach||26)*e.sc+P.r+e.r+4)hitPlayer(e.dmg)}}
  const mv=k=>{e.x+=ux*sp*k*dt;e.y+=uy*sp*k*dt};
  switch(e.kind){
    case'melee':{
      const reach=(def.reach||26)*e.sc+P.r+e.r-6;
      if(e.swing>0)break;
      if(d>reach)mv(1);else if(e.cd<=0){e.swing=.28;e.pendingHit=true;e.cd=1+rand(0,.3)}
      break}
    case'charger':{
      if(e.st==='move'){
        const reach=(def.reach||26)*e.sc+P.r+e.r-6;
        if(e.swing<=0){
          if(d>reach)mv(1);else if(e.cd<=0){e.swing=.28;e.pendingHit=true;e.cd=1.1}
          if(d<270&&d>110&&e.cd<=0){e.st='wind';e.stT=.55}
        }
      }else if(e.st==='wind'){
        e.stT-=dt;if(e.stT<=0){e.st='dash';e.stT=.42;e.dashDir=Math.atan2(dy,dx);e.dashHit=false;e.face=e.dashDir}
      }else if(e.st==='dash'){
        e.x+=Math.cos(e.dashDir)*340*dt;e.y+=Math.sin(e.dashDir)*340*dt;
        if(!e.dashHit&&d<e.r+P.r+4){e.dashHit=true;hitPlayer(e.dmg)}
        e.stT-=dt;if(e.stT<=0){e.st='move';e.cd=rand(1.8,2.8)}
      }
      break}
    case'ranged':{
      const rg=def.range;
      if(d>rg+30)mv(1);else if(d<rg-80)mv(-.8);else{const t=Math.sin(time*.8+e.walk)*.5;e.x+=-uy*sp*t*dt;e.y+=ux*sp*t*dt}
      if(e.cd<=0&&d<rg+80){fireProj(e,Math.atan2(dy,dx),def);e.cd=def.fireCd*rand(.85,1.2)}
      break}
    case'bomber':{
      const rg=def.range;
      if(d>rg+30)mv(1);else if(d<rg-90)mv(-.8);
      if(e.cd<=0&&d<rg+100){bombs.push({x:clamp(P.x+P.vx*.4,30,W-30),y:clamp(P.y+P.vy*.4,30,H-30),t:0,T:1.15,r:58,dmg:e.dmg});e.swing=.25;e.cd=def.fireCd*rand(.9,1.2)}
      break}
    case'boss':updateBoss(e,dt,d,ux,uy,sp);break;
  }
}
function updateBoss(e,dt,d,ux,uy,sp){
  const B=BIOMES[e.biome];
  if(e.st==='enter'){e.y+=70*dt;e.face=Math.PI/2;if(e.y>125){e.st='move';e.cd=1.6}return}
  e.rot+=dt;
  if(e.st==='move'){
    if(d>e.r+P.r+8){e.x+=ux*sp*dt;e.y+=uy*sp*dt}
    if(d<e.r+P.r+4)hitPlayer(e.dmg*.5);
    if(e.cd<=0){
      const a=e.seq[e.atkIdx++%e.seq.length];
      if(a==='slam'){e.st='slamWind';e.stT=1}

      else if(a==='charge'){e.st='chargeWind';e.stT=.8}
      else if(a==='rain'){
        for(let i=0;i<5+Math.floor(cfg.bi/3);i++)bombs.push({x:clamp(P.x+rand(-120,120),30,W-30),y:clamp(P.y+rand(-100,100),30,H-30),t:-i*.12,T:1.2,r:62,dmg:e.dmg*.8});

        ring(e.x,e.y,120,B.accent,.5,5);e.cd=2.8;
      }
    }
  }else if(e.st==='slamWind'){

    if(e.stT<=0){
      const R=e.r*2.8;ring(e.x,e.y,R,B.accent,.5,10);burst(e.x,e.y,B.accent,40,300,5);shake=14;

      const fire=o=>{for(let i=0;i<n;i++){const an=off+o+i/n*TAU;eprojs.push({x:e.x,y:e.y,vx:Math.cos(an)*190,vy:Math.sin(an)*190,r:8,c:B.accent,dmg:e.dmg*.55,life:5})}ring(e.x,e.y,70,B.accent,.3,5)};
      fire(0);later.push({t:.45,fn:()=>{if(!e.dead)fire(Math.PI/n)}});
      e.st='move';e.cd=rand(1.8,2.6);
    }
  }else if(e.st==='chargeWind'){
    e.stT-=dt;e.face=Math.atan2(P.y-e.y,P.x-e.x);
    if(e.stT<=0){e.st='chargeDash';e.stT=.55;e.dashDir=e.face;e.dashHit=false}
  }else if(e.st==='chargeDash'){
    e.x=clamp(e.x+Math.cos(e.dashDir)*420*dt,50,W-50);e.y=clamp(e.y+Math.sin(e.dashDir)*420*dt,60,H-50);
    if(!e.dashHit&&dist(e,P)<e.r+P.r){e.dashHit=true;hitPlayer(e.dmg*1.1);shake=8}
    e.stT-=dt;if(e.stT<=0){e.st='move';e.cd=rand(1.8,2.6);burst(e.x,e.y,B.accent,20,220,4)}
  }
}
function separate(){
  for(let i=0;i<enemies.length;i++){const a=enemies[i];if(a.dead)continue;
    for(let j=i+1;j<enemies.length;j++){const b=enemies[j];if(b.dead)continue;
      const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy),m=a.r+b.r-2;
      if(d>0&&d<m){const p=(m-d)/2,nx=dx/d,ny=dy/d;
        const wa=a.boss?0:(b.boss?1:.5),wb=b.boss?0:(a.boss?1:.5);
        a.x-=nx*p*2*wa;a.y-=ny*p*2*wa;b.x+=nx*p*2*wb;b.y+=ny*p*2*wb}}}
}

/* ---------- update ---------- */
function nearestEnemy(x,y,range){let t=null,bd=range;for(const e of enemies){if(e.dead)continue;const d=Math.hypot(e.x-x,e.y-y);if(d<bd){bd=d;t=e}}return t}
function updatePlayer(dt){
  let ix=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),iy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);
  const m=Math.hypot(ix,iy);if(m){ix/=m;iy/=m}
  if(P.slowT>0)P.slowT-=dt;if(P.hasteT>0)P.hasteT-=dt;if(P.shieldT>0){P.shieldT-=dt;if(P.shieldT<=0)P.shield=0}
  const sp=P.speed*(P.slowT>0?.65:1)*(P.hasteT>0?1.4:1),k=Math.min(1,dt*12);
  P.vx+=(ix*sp-P.vx)*k;P.vy+=(iy*sp-P.vy)*k;
  P.x=clamp(P.x+P.vx*dt,28,W-28);P.y=clamp(P.y+P.vy*dt,34,H-26);
  P.aim=Math.atan2(mouse.y-P.y,mouse.x-P.x);
  P.fireCd-=dt;P.inv-=dt;P.walk+=Math.hypot(P.vx,P.vy)*dt*.06;
  for(const a of ab)a.cd-=dt;
  if(state==='wave'&&mouse.down&&P.fireCd<=0){
    const t=staffTip();bolts.push({x:t.x,y:t.y,vx:Math.cos(P.aim)*640,vy:Math.sin(P.aim)*640,dmg:12*DM(),life:1.1,c:curStaff.orb,r:5});
    P.fireCd=.3/(P.hasteT>0?1.8:1);burst(t.x,t.y,curStaff.orb,3,90,2.5);
  }
}
function updateHelper(dt){
  if(!helper)return;
  const h=helper,d=h.def,tx=P.x-38,ty=P.y-34+Math.sin(time*2.4)*4;
  h.x+=(tx-h.x)*Math.min(1,dt*6);h.y+=(ty-h.y)*Math.min(1,dt*6);
  h.cd-=dt;
  const tg=state==='wave'?nearestEnemy(h.x,h.y,430):null;
  if(tg)h.face=Math.atan2(tg.y-h.y,tg.x-h.x);else h.face=P.aim;
  if(tg&&h.cd<=0){
    for(let k=0;k<d.shots;k++){const an=h.face+(d.shots===1?0:(k-(d.shots-1)/2)*.16);
      bolts.push({x:h.x,y:h.y,vx:Math.cos(an)*540,vy:Math.sin(an)*540,dmg:d.dmg*P.upMul,life:1,c:d.col,r:4,pierce:d.pierce,hit:d.pierce?new Set():null,small:true})}

  }
}
function updateWorld(dt){
  time+=dt;

  if(state==='wave'){
    spawnT-=dt;
    if(spawnT<=0&&queue.length){
      if(alive()<spawnCap){const def=queue.shift(),p=spawnPos();enemies.push(makeGnome(def,p.x,p.y));spawnT=rand(.25,.5)}else spawnT=.2;
    }

    if(z.kind==='poison'){for(const e of enemies)if(!e.dead&&Math.hypot(e.x-z.x,e.y-z.y)<z.r+e.r){e.slowT=Math.max(e.slowT,.3);e.slowF=.6}}

    if(Math.random()<.5){const c=z.kind==='poison'?'#8ee05a':z.kind==='vortex'?'#b57bff':'#ff8a2b';parts.push({x:z.x+rand(-z.r,z.r)*.8,y:z.y+rand(-z.r,z.r)*.8,vx:0,vy:z.kind==='fire'?-40:-15,t:0,T:.5,c,s:rand(2,4)})}
  }
  zones=zones.filter(z=>z.t<z.T);
  // orbit blades
  if(P.orbit){const o=P.orbit;o.t-=dt;o.ang+=4.5*dt;
    for(let i=0;i<o.n;i++){const a=o.ang+i*TAU/o.n,ox=P.x+Math.cos(a)*72,oy=P.y+Math.sin(a)*72;
      for(const e of enemies){if(e.dead||e.orbCd>0)continue;if(Math.hypot(e.x-ox,e.y-oy)<e.r+11){damageEnemy(e,o.dmg*DM(),{color:'#e5d4ff'});e.orbCd=.4;burst(ox,oy,'#c9a3ff',4,120,2.5)}}
      eprojs=eprojs.filter(p=>Math.hypot(p.x-ox,p.y-oy)>p.r+12)}

  }
  eprojs=eprojs.filter(p=>p.life>0);
  // bombs
  for(const b of bombs){b.t+=dt;if(b.t>=b.T){ring(b.x,b.y,b.r,'#ff7a2f',.3,6);burst(b.x,b.y,'#ffb347',18,220,4);shake=Math.max(shake,5);if(state==='wave'&&Math.hypot(P.x-b.x,P.y-b.y)<b.r+P.r-3)hitPlayer(b.dmg);b.dead=true}}
  bombs=bombs.filter(b=>!b.dead);
  // timers / fx
  for(const l of later)l.t-=dt;
  for(const l of later.filter(l=>l.t<=0))l.fn();
  later=later.filter(l=>l.t>0);
  for(const r of rings)r.t+=dt;rings=rings.filter(r=>r.t<r.T);

  for(const p of parts){p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.96;p.vy*=.96}parts=parts.filter(p=>p.t<p.T);

let shopScroll=0;
function showShop(kind){
  state='shop';const isS=kind==='staff',list=isS?STAFFS:HELPERS;
  const owned=isS?SAVE.staffs:SAVE.helpers,eq=isS?SAVE.staff:SAVE.helper;
  ov.innerHTML=`<div class="panel wide"><div class="bar"><button class="back" id="back">Back</button><h2>${isS?'Staffs':'WizHelpers'}</h2><span class="gal">${COIN} ${fmt(SAVE.gal)}</span></div>
  <p class="sub" style="margin-top:0">${isS?'Better staffs hit harder and come with different spells.':'A mini wizard floats at your side and casts for you. Pick one to bring along.'}</p>
  <div class="grid">${list.map((it,i)=>{
    const has=isS?owned.includes(i):owned.includes(i),on=eq===i;
    const stats=isS?`Damage ×${it.dmg}`:`${it.dmg} dmg × ${it.shots} shot${it.shots>1?'s':''}, ${(1/it.rate).toFixed(1)}/s${it.pierce?', pierces':''}`;
    const body=isS?`<ul>${it.abil.map(a=>`<li>${arcSVG(a.a)}${a.n}</li>`).join('')}</ul>`:'';
    const btn=on?`<button class="buy on" disabled>Equipped</button>`:has?`<button class="buy" data-act="eq" data-i="${i}">Equip</button>`:`<button class="buy" data-act="buy" data-i="${i}" ${SAVE.gal<it.cost?'disabled':''}>Buy ${COIN} ${fmt(it.cost)}</button>`;
    return `<div class="item ${on?'eq':''}"><div class="pv">${isS?staffSVG(it):helperSVG(it)}</div><h3>${it.name}</h3><p class="st">${stats}</p>${body}${btn}</div>`}).join('')}</div>
  ${isS?'':`<div class="menu"><button class="back" id="solo">Go without a WizHelper</button></div>`}</div>`;
  ov.classList.add('on');ov.scrollTop=shopScroll;
  document.getElementById('back').onclick=()=>{shopScroll=0;showHome()};
  const solo=document.getElementById('solo');if(solo)solo.onclick=()=>{shopScroll=ov.scrollTop;SAVE.helper=-1;save();showShop(kind)};

}

    case'snowball':circ(9,0,6,'#f4fbff');circ(7,-2,2,'#d5ecf8');break;

function drawGnome(e,sc,crown){
  ctx.save();ctx.translate(e.x,e.y);ctx.scale(sc,sc);
  const d=e.def,bob=Math.sin(e.walk)*1.6,fx=Math.cos(e.face)*1.8;
  ctx.globalAlpha=.3;ctx.fillStyle='#000';ctx.beginPath();ctx.ellipse(0,14,12,4.5,0,0,TAU);ctx.fill();ctx.globalAlpha=1;
  const charging=e.st==='wind'||e.st==='chargeWind';
  const sw=e.swing>0?lerp(-1.2,1.2,1-e.swing/.28):0;
  const behind=Math.sin(e.face)<-.3;
  const wp=()=>{ctx.save();ctx.translate(0,3+bob*.4);ctx.rotate(e.face+sw);ctx.translate(9,0);drawWeapon(d.weapon);ctx.restore()};
  if(behind)wp();
  ctx.beginPath();ctx.ellipse(0,4+bob,10.5,11,0,0,TAU);ctx.fillStyle=d.robe;ctx.fill();
  line(-9,6+bob,9,6+bob,'#3b2a14',2.5);
  circ(0,-7+bob,6.6,'#f2cfa8');
  ctx.beginPath();ctx.moveTo(-6.6,-5+bob);ctx.quadraticCurveTo(-7,6+bob,0,10+bob);ctx.quadraticCurveTo(7,6+bob,6.6,-5+bob);ctx.quadraticCurveTo(0,-1+bob,-6.6,-5+bob);ctx.fillStyle='#f4f1ea';ctx.fill();
  circ(fx*.7,-6+bob,2.2,'#e9a59a');
  circ(-2.6+fx,-9+bob,1.1,'#222');circ(2.6+fx,-9+bob,1.1,'#222');
  ctx.beginPath();ctx.moveTo(-9,-11+bob);ctx.quadraticCurveTo(-3,-24+bob,6,-35+bob);ctx.quadraticCurveTo(7,-22+bob,9,-11+bob);ctx.closePath();ctx.fillStyle=charging&&Math.floor(time*16)%2?'#ffffff':d.hat;ctx.fill();
  ctx.beginPath();ctx.ellipse(0,-11+bob,10.5,2.6,0,0,TAU);ctx.fillStyle=d.hat;ctx.fill();
  if(crown){ctx.beginPath();ctx.moveTo(-8,-11+bob);ctx.lineTo(-8,-19+bob);ctx.lineTo(-4,-15+bob);ctx.lineTo(0,-21+bob);ctx.lineTo(4,-15+bob);ctx.lineTo(8,-19+bob);ctx.lineTo(8,-11+bob);ctx.closePath();ctx.fillStyle='#f0c14b';ctx.fill();ctx.strokeStyle='#8a5a00';ctx.lineWidth=1;ctx.stroke()}
  if(!behind)wp();
  if(e.hitFlash>0){ctx.globalAlpha=.6;ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(0,-2,11,17,0,0,TAU);ctx.fill();ctx.globalAlpha=1}
  ctx.restore();
}

    ctx.fillStyle=pal.c;for(const s of[-1,1]){ctx.beginPath();ctx.moveTo(s*10,-58);ctx.lineTo(s*22,-78);ctx.lineTo(s*17,-56);ctx.closePath();ctx.fill()}
  }else if(pal.st==='moss'){
    ctx.fillStyle=pal.c;for(const [x,y,r] of [[-20,-10,7],[10,4,9],[-8,22,6],[24,-14,6],[-36,-24,8],[36,-26,7]])circ(x,y,r,pal.c);
    ctx.strokeStyle='#8fd14a';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-10,-58);ctx.quadraticCurveTo(-18,-72,-8,-78);ctx.moveTo(10,-58);ctx.quadraticCurveTo(20,-72,12,-80);ctx.stroke();
  }else{
    ctx.beginPath();ctx.moveTo(-20,-58);ctx.lineTo(20,-58);ctx.lineTo(28,-22);ctx.lineTo(-28,-22);ctx.closePath();ctx.fillStyle='#e2b64d';ctx.fill();
    ctx.fillStyle='#2f6fb0';for(let k=-1;k<=1;k++)ctx.fillRect(k*11-3,-57,6,32);
    rr(-18,-58,36,30,8,null,'#8a6a1a');
  }
  ctx.shadowColor=pal.glow;ctx.shadowBlur=12;rr(-12,-46,9,6,2,pal.glow);rr(3,-46,9,6,2,pal.glow);ctx.shadowBlur=0;

function drawStatus(e){

}
function drawStaffHead(S,x){

    case'crystal':ctx.beginPath();ctx.moveTo(x-4,0);ctx.lineTo(x+2,-6.5);ctx.lineTo(x+12,0);ctx.lineTo(x+2,6.5);ctx.closePath();ctx.fillStyle=S.orb;ctx.fill();ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=1;ctx.stroke();break;
    case'crescent':ctx.beginPath();ctx.arc(x,0,8,-1.9,1.9);ctx.strokeStyle=S.orb;ctx.lineWidth=4;ctx.lineCap='round';ctx.stroke();circ(x,0,2.5,'#fff');break;

    case'star':ctx.beginPath();for(let k=0;k<8;k++){const a=k/8*TAU,r=k%2?3.2:9.5;k?ctx.lineTo(x+Math.cos(a)*r,Math.sin(a)*r):ctx.moveTo(x+Math.cos(a)*r,Math.sin(a)*r)}ctx.closePath();ctx.fillStyle=S.orb;ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=.8;ctx.stroke();break;
    case'flame':ctx.beginPath();ctx.moveTo(x-6,0);ctx.quadraticCurveTo(x-2,-8,x+11,0);ctx.quadraticCurveTo(x-2,8,x-6,0);ctx.fillStyle=S.orb;ctx.fill();circ(x,0,3,'#fff6c0');break;
    default:circ(x,0,6,S.orb);circ(x-1.5,-1.5,2,'#fff');

}

function drawTelegraphs(){

    if(e.kind==='charger'&&e.st==='wind'){ctx.save();ctx.translate(e.x,e.y);ctx.rotate(Math.atan2(P.y-e.y,P.x-e.x));ctx.fillStyle='rgba(255,70,70,'+(.15+.15*Math.sin(time*30))+')';ctx.fillRect(0,-8,190,16);ctx.restore()}

  drawHelper();
  if(P.orbit){const o=P.orbit;for(let i=0;i<o.n;i++){const a=o.ang+i*TAU/o.n,ox=P.x+Math.cos(a)*72,oy=P.y+Math.sin(a)*72;ctx.globalAlpha=.4;circ(ox,oy,14,'#c9a3ff');ctx.globalAlpha=1;circ(ox,oy,7,'#e5d4ff');circ(ox-2,oy-2,2.5,'#fff')}}
  for(const p of eprojs){ctx.globalAlpha=.35;circ(p.x,p.y,p.r*1.9,p.c);ctx.globalAlpha=1;circ(p.x,p.y,p.r,p.c);ctx.strokeStyle='rgba(0,0,0,.35)';ctx.lineWidth=1;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,TAU);ctx.stroke()}
  for(const b of bolts){
    if(b.big){ctx.strokeStyle=b.c;ctx.lineWidth=8;ctx.globalAlpha=.4;ctx.beginPath();ctx.moveTo(b.x-b.vx*.05,b.y-b.vy*.05);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.lineWidth=3;ctx.strokeStyle='#fff';ctx.globalAlpha=1;ctx.stroke()}
    else{ctx.globalAlpha=.35;circ(b.x,b.y,b.small?7:9,b.c);ctx.globalAlpha=1;circ(b.x,b.y,b.small?3:4.5,'#fff')}
  }
  for(const f of fireballs){const g=ctx.createRadialGradient(f.x,f.y,2,f.x,f.y,20);g.addColorStop(0,'rgba(255,230,140,1)');g.addColorStop(.4,'rgba(255,130,40,.9)');g.addColorStop(1,'rgba(255,90,20,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(f.x,f.y,20,0,TAU);ctx.fill()}
  for(const r of rings){const f=r.t/r.T,rad=r.r1*(1-Math.pow(1-f,3));ctx.beginPath();ctx.arc(r.x,r.y,rad,0,TAU);ctx.fillStyle=r.c;ctx.globalAlpha=(1-f)*.16;ctx.fill();ctx.globalAlpha=1-f;ctx.strokeStyle=r.c;ctx.lineWidth=r.w*(1-f)+1;ctx.stroke();ctx.globalAlpha=1}
  for(const b of bolts2){const a=1-b.t/b.T;ctx.globalAlpha=a;ctx.lineJoin='round';
    ctx.beginPath();b.pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.strokeStyle='rgba(255,224,102,.5)';ctx.lineWidth=9;ctx.stroke();
    ctx.strokeStyle='#fffbe0';ctx.lineWidth=2.5;ctx.stroke();ctx.globalAlpha=1}
  for(const p of parts){ctx.globalAlpha=1-p.t/p.T;ctx.fillStyle=p.c;ctx.fillRect(p.x-p.s/2,p.y-p.s/2,p.s,p.s)}ctx.globalAlpha=1;
  ctx.textAlign='center';ctx.font='700 15px "Alegreya Sans",sans-serif';
  for(const t of texts){ctx.globalAlpha=1-Math.pow(t.t/t.T,2);ctx.lineWidth=3;ctx.strokeStyle='rgba(0,0,0,.7)';ctx.strokeText(t.txt,t.x,t.y);ctx.fillStyle=t.c;ctx.fillText(t.txt,t.x,t.y)}ctx.globalAlpha=1;
}
function panel(x,y,w,h){rr(x,y,w,h,10,'rgba(16,10,32,.78)','rgba(255,255,255,.14)')}
function drawHUD(){
  const B=BIOMES[cfg.bi];
  panel(14,14,236,66);
  ctx.textAlign='left';ctx.fillStyle='#f3ecd9';ctx.font='700 22px Almendra,Georgia,serif';ctx.fillText('Wave '+L+' / '+MAXLV,26,40);
  ctx.font='500 13px "Alegreya Sans",sans-serif';ctx.fillStyle=B.accent;ctx.textAlign='right';ctx.fillText(B.name,238,39);
  ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(26,50,212,16);
  const hf=Math.max(0,P.hp/P.maxHp);ctx.fillStyle=hf>.35?'#d8434f':'#ff2a3a';ctx.fillRect(26,50,212*hf,16);
  if(P.shield>0){ctx.fillStyle='rgba(127,200,255,.8)';ctx.fillRect(26,50,Math.min(212,212*P.shield/P.maxHp),4)}
  ctx.fillStyle='#fff';ctx.font='700 12px "Alegreya Sans",sans-serif';ctx.textAlign='center';ctx.fillText(Math.ceil(P.hp)+' / '+P.maxHp,132,63);
  const rem=queue.length+alive();
  panel(W-160,14,146,58);ctx.textAlign='right';ctx.fillStyle='#f3ecd9';ctx.font='700 16px "Alegreya Sans",sans-serif';ctx.fillText(rem+' gnome'+(rem===1?'':'s'),W-26,38);
  ctx.fillStyle='#f0c14b';ctx.fillText(fmt(SAVE.gal)+' Galleons',W-26,60);
  const boss=enemies.find(e=>e.boss&&!e.dead);
  if(boss){const w=420,x=(W-w)/2,y=22;panel(x-12,y-14,w+24,50);ctx.textAlign='center';ctx.fillStyle='#f3ecd9';ctx.font='700 18px Almendra,Georgia,serif';ctx.fillText(boss.def.name,W/2,y+4);
    ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(x,y+10,w,12);ctx.fillStyle=B.accent;ctx.fillRect(x,y+10,w*Math.max(0,boss.hp/boss.maxHp),12)}
  const sz=54,gap=14,tw=sz*3+gap*2,x0=(W-tw)/2,y0=H-sz-22;
  for(let i=0;i<3;i++){
    const def=curStaff.abil[i],A=ARCH[def.a],col=ACOL[def.a],x=x0+i*(sz+gap),c=ab[i];
    rr(x,y0,sz,sz,10,'rgba(16,10,32,.85)',col+'aa');
    ctx.globalAlpha=c.cd>0?.5:1;ctx.drawImage(ICONIMG[def.a],x+8,y0+6,sz-16,sz-16);ctx.globalAlpha=1;
    if(c.cd>0){
      const f=clamp(c.cd/A.st(c.lv).cd,0,1);
      ctx.save();rr(x,y0,sz,sz,10);ctx.clip();ctx.beginPath();ctx.moveTo(x+sz/2,y0+sz/2);ctx.arc(x+sz/2,y0+sz/2,sz,-Math.PI/2,-Math.PI/2+TAU*f);ctx.closePath();ctx.fillStyle='rgba(0,0,0,.55)';ctx.fill();ctx.restore();
      ctx.fillStyle='#fff';ctx.font='700 16px "Alegreya Sans",sans-serif';ctx.textAlign='center';ctx.fillText(c.cd.toFixed(1),x+sz/2,y0+sz/2+5);
    }
    ctx.textAlign='center';ctx.font='700 13px "Alegreya Sans",sans-serif';ctx.fillStyle=col;ctx.fillText(String(i+1),x+sz/2,y0+sz+14);
    ctx.textAlign='right';ctx.fillStyle='#fff';ctx.font='700 12px "Alegreya Sans",sans-serif';ctx.fillText('Lv '+c.lv,x+sz-4,y0+13);
    ctx.textAlign='center';ctx.font='500 11px "Alegreya Sans",sans-serif';ctx.fillStyle='rgba(243,236,217,.75)';ctx.fillText(def.n,x+sz/2,y0-5);
  }
  if(banner){const f=banner.t/banner.T,a=f<.1?f/.1:f>.8?(1-f)/.2:1;ctx.globalAlpha=clamp(a,0,1);ctx.textAlign='center';
    ctx.font='700 44px Almendra,Georgia,serif';ctx.lineWidth=6;ctx.strokeStyle='rgba(0,0,0,.75)';ctx.lineJoin='round';ctx.strokeText(banner.title,W/2,190);ctx.fillStyle='#fff4d0';ctx.fillText(banner.title,W/2,190);
    if(banner.sub){ctx.font='500 20px "Alegreya Sans",sans-serif';ctx.lineWidth=4;ctx.strokeText(banner.sub,W/2,222);ctx.fillStyle=banner.sub[0]==='+'?'#f0c14b':'#f3ecd9';ctx.fillText(banner.sub,W/2,222)}ctx.globalAlpha=1}
}
function draw(){
  ctx.save();
  if(shake>0)ctx.translate(rand(-shake,shake)*.5,rand(-shake,shake)*.5);
  drawWorld();
  ctx.restore();
  if(state==='wave'||state==='clear'||state==='upgrade'||state==='ability')drawHUD();
}

/* ---------- loop ---------- */
let last=performance.now();
function frame(t){
  const dt=Math.min(.05,(t-last)/1000);last=t;
  if(state==='wave'||state==='clear')updateWorld(dt);
  else{time+=dt;if(P){P.walk+=0;if(helper){helper.x+=(P.x-38-helper.x)*Math.min(1,dt*6);helper.y+=(P.y-34+Math.sin(time*2.4)*4-helper.y)*Math.min(1,dt*6);helper.face=P.aim}}for(const p of parts){p.t+=dt}parts=parts.filter(p=>p.t<p.T)}
  draw();requestAnimationFrame(frame);
}
newGame();
showHome();
requestAnimationFrame(frame);
/*TESTHOOK*/
})();
</script>
